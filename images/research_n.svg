<svg width="780" height="450" viewBox="0 0 780 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Learning, Control, and Robotics Integration</title>
  <desc id="desc">A diagram showing learning and control informing one another and both contributing to robotics.</desc>

  <defs>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#115e92"/>
      <stop offset="100%" stop-color="#0b314c"/>
    </linearGradient>

    <filter id="shadow" x="-25%" y="-30%" width="150%" height="165%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix"
        values="0 0 0 0 0.043
                0 0 0 0 0.192
                0 0 0 0 0.298
                0 0 0 0.24 0" result="shadowColor"/>
      <feMerge>
        <feMergeNode in="shadowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#115e92"/>
    </marker>
  </defs>

  <style>
    .node-text {
      fill: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 21px;
      font-weight: 650;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0.03em;
    }
    .arrow {
      fill: none;
      stroke: #115e92;
      stroke-width: 3.2;
      stroke-linecap: round;
      marker-end: url(#arrow);
    }
    .title {
      fill: #394663;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16.5px;
      font-weight: 500;
      text-anchor: middle;
    }
  </style>

  <!-- Background -->
  <rect width="780" height="450" rx="32" fill="#f5f7fa"/>
  <circle cx="80" cy="63" r="34" fill="#dfefff" opacity="0.55"/>
  <circle cx="704" cy="67" r="43" fill="#d6e5ff" opacity="0.32"/>
  <circle cx="718" cy="377" r="58" fill="#e3f2ff" opacity="0.18"/>

  <text class="title" x="390" y="30">Learning–Control–Robotics Integration</text>

  <!-- Nodes: positioned farther apart -->
  <g filter="url(#shadow)">
    <rect x="55" y="88" width="220" height="84" rx="42" fill="url(#nodeGrad)"/>
    <text class="node-text" x="165" y="130">LEARNING</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="88" width="220" height="84" rx="42" fill="url(#nodeGrad)"/>
    <text class="node-text" x="615" y="130">CONTROL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="320" width="240" height="88" rx="44" fill="url(#nodeGrad)"/>
    <text class="node-text" x="390" y="364">ROBOTICS</text>
  </g>

  <!-- Learning and Control communicate via separated arcs -->
  <path class="arrow" d="M 278 112 C 340 77, 440 77, 498 112"/>
  <path class="arrow" d="M 502 149 C 440 184, 340 184, 282 149"/>

  <!-- Both feed into Robotics; endpoints are separated -->
  <path class="arrow" d="M 225 176 C 245 235, 292 281, 350 312"/>
  <path class="arrow" d="M 555 176 C 535 235, 488 281, 430 312"/>
</svg>
